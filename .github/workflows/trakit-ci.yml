name: TrakIt CI

on:
  push:
    branches: [main, claude/build-trakit-app-p1mEd]
    paths:
      - "trakit/**"
      - ".github/workflows/trakit-ci.yml"
  pull_request:
    paths:
      - "trakit/**"
      - ".github/workflows/trakit-ci.yml"

defaults:
  run:
    working-directory: trakit

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Scaffold platform folders
        run: |
          flutter create . \
            --platforms=ios,android,web \
            --org com.trakit \
            --project-name trakit

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter=expanded

      - name: Build APK (debug — sanity check the toolchain)
        run: flutter build apk --debug
