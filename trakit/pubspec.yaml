name: trakit
description: TrakIt — your next-generation AI money companion. Capture, understand and feel your spending.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  http: ^1.2.2

  # Capture — real implementations (require iOS/Android platform configuration)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Monetisation-ready (kept commented to avoid native config in the bare scaffold)
  # google_mobile_ads: ^5.1.0
  # purchases_flutter: ^6.29.4

  # Firebase-ready (kept commented to avoid plist/json requirement)
  # firebase_core: ^3.1.1
  # firebase_auth: ^5.1.0
  # cloud_firestore: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  image: ^4.2.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0B0613"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
